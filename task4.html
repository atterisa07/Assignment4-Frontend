<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <a href="index.html">Task 0</a>
    <a href="task1.html">Task 1</a>
    <a href="task2.html">Task 2</a>
    <a href="task3.html">Task 3</a>
    <a href="task4.html">Task 4</a>
</nav>

<div class="container mt-5">

    <h1>Registration Form</h1>

    <form id="registrationForm" novalidate>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label for="firstName" class="form-label">First Name:</label>
                <input type="text" class="form-control"
                       id="firstName" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">First name is required.</div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="lastName" class="form-label">Last Name:</label>
                <input type="text" class="form-control"
                       id="lastName" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Last name is required.</div>
            </div>

        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control"
                   id="email" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Enter a valid email.</div>
        </div>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label for="password" class="form-label">Password:</label>
                <input type="password" class="form-control"
                       id="password" minlength="6" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Minimum 6 characters.</div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="confirmPassword" class="form-label">
                    Confirm Password:
                </label>
                <input type="password" class="form-control"
                       id="confirmPassword" required>
                <div class="valid-feedback">Passwords match!</div>
                <div class="invalid-feedback">Passwords must match.</div>
            </div>

        </div>

        <div class="mb-3">
            <label class="form-label">Gender:</label><br>

            <input type="radio" name="gender" value="male" required>
            <label>Male</label>

            <input type="radio" name="gender" value="female">
            <label>Female</label>
        </div>

        <div class="mb-3">
            <label class="form-label">Hobbies:</label><br>

            <input type="checkbox" value="music">
            <label>Music</label>

            <input type="checkbox" value="sports">
            <label>Sports</label>

            <input type="checkbox" value="reading">
            <label>Reading</label>
        </div>

        <div class="mb-3">
            <label for="country" class="form-label">Country:</label>

            <select id="country" class="form-select" required>
                <option value="">Choose country</option>
                <option value="kazakhstan">Kazakhstan</option>
                <option value="usa">USA</option>
                <option value="uk">UK</option>
            </select>

            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Choose a country.</div>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
        <button type="reset" class="btn btn-secondary">Reset</button>

    </form>

</div>

<script>
    const form = document.getElementById("registrationForm");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        if (password.value !== confirmPassword.value) {
            confirmPassword.setCustomValidity("Passwords do not match");
        } else {
            confirmPassword.setCustomValidity("");
        }

        const inputs = form.querySelectorAll("input, select");

        inputs.forEach(function(input) {
            if (input.type === "radio" || input.type === "checkbox") {
                return;
            }

            if (input.checkValidity()) {
                input.classList.add("is-valid");
                input.classList.remove("is-invalid");
            } else {
                input.classList.add("is-invalid");
                input.classList.remove("is-valid");
            }
        });

        if (form.checkValidity()) {
            alert("Registration successful!");
        }
    });

    form.addEventListener("reset", function() {
        const inputs = form.querySelectorAll("input, select");

        inputs.forEach(function(input) {
            input.classList.remove("is-valid", "is-invalid");
        });

        confirmPassword.setCustomValidity("");
    });
</script>

</body>
</html>
